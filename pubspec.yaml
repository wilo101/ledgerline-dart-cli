name: ledgerline
description: Personal ledger in Dart. A command-line tool plus its own small HTTP service (shelf, JSON-file storage). Standalone, no other services needed.
publish_to: none
version: 1.0.0
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  args: ^2.5.0
  http: ^1.2.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
executables:
  ledgerline:
